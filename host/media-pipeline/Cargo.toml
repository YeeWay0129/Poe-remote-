[package]
name = "media-pipeline"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
windows-capture = ["dep:windows-sys"]
windows-mf-h264 = ["dep:windows"]

[dependencies]
host-core = { path = "../host-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", optional = true, features = ["Win32_Media_MediaFoundation"] }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging"
] }
